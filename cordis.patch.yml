# dsh-protect-tests: block edits that make tests check less.
# To change settings, add a row like the one below to
# ~/.dsh/profiles/<profile>/cordis.patch.yml (one profile) or ~/.dsh/cordis.patch.yml
# (every profile). Keys you leave out keep their defaults.
#
# - id: protect-tests
#   config:
#     mode: deny                 # or ask
#     minAssertionsRemoved: 2
#     disabledSignals: []        # skip, fewer-assertions, fewer-tests, trivial-assert,
#                                # commented-assert, swallowed-failure, weaker-assert
#     guardDeletes: true
#     guardTestScript: true
- insert:
    - id: protect-tests
      name: dsh-protect-tests
